name: CI

on:
  push:
    branches: [main]
    # 发布 Gate（2026-09-29 补）：打 tag 时同样触发全套 —— 让「发布动作本身」过 CI。
    # 背景：v3.5.16 的 tag 对应 CI 是红的（check_no_deps 白名单漂移），
    # 而当时流程里「CI 绿」不是发布的前置 —— 红灯在发布之后才被发现。
    # ⚠️ 已知边界（GitHub 文档）：一次推送超过 3 个 tag 时不会触发事件。
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 测试（${{ matrix.os }} / Python ${{ matrix.python-version }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 确认零第三方依赖
        run: python .github/scripts/check_no_deps.py

      - name: 四关自测
        run: python tests/four_gate_selftest.py

      - name: 安装链路
        run: python tests/cmd_chain_test.py

      - name: 对抗测试
        run: python tests/adversarial_test.py

      - name: 预算安全
        run: python tests/budget_safety_test.py

      - name: 意图门
        run: python tests/intent_gate_test.py

      - name: 升级路径
        run: python tests/upgrade_path_test.py

      - name: G5 真实回归
        run: python tests/g5_real_regression_test.py

      - name: 源身份一致性回归
        run: python tests/source_identity_consistency_test.py

      - name: Gate 事件记录
        run: python tests/gate_events_test.py

      - name: G5 Windows 路径回归
        run: python tests/g5_windows_path_test.py

      - name: 安装参数回归
        run: python tests/install_cli_test.py

      - name: MCP 字段分派
        run: python tests/mcp_field_dispatch_test.py

      - name: G3 归属误报与漏拦回归
        run: python tests/g3_attribution_regression_test.py

      - name: 语义意图（G7）
        run: python tests/semantic_intent_test.py

      - name: 语义归属（G3）
        run: python tests/semantic_g3_test.py

      - name: 语义输入合同 / 时间预算 / 失败规则
        run: python tests/semantic_contract_test.py

      - name: 状态故障披露（G7 读失败 / 写失败卡片）
        run: python tests/g7_state_disclosure_test.py

      - name: 统计工具 cohort 口径
        run: python tests/gate_stats_cohort_test.py

      - name: 统计工具重复触发口径
        run: python tests/gate_stats_repeats_test.py

      - name: 文档数字一致性
        run: python tests/doc_consistency_test.py

      - name: 版本一致性
        run: python .github/scripts/check_version_consistency.py

      - name: 死段检测
        run: python .github/scripts/check_dead_policy.py

      # ⚠️ 只读检查 —— 绝不带 --write。
      #    CI 自动刷新源身份 = 任何提交都能把自己「合法化」，
      #    声明立刻失去意义。写操作只能由人显式发起。
      - name: 源身份只读校验
        run: python tools/source_identity.py
